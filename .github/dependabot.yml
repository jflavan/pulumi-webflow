version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # The "/" entry above only scans .github/workflows; composite actions must be
  # listed explicitly so their pinned `uses:` steps are kept up to date too.
  - package-ecosystem: github-actions
    directory: "/.github/actions/download-provider"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/.github/actions/download-sdk"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/.github/actions/setup-tools"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/tools/webflow-auth"
    schedule:
      interval: weekly
