name: release

on:
  push:
    tags:
      - v*.*.*

env:
  PROVIDER: webflow
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  NODEVERSION: "20.x"
  PYTHONVERSION: "3.11.8"
  DOTNETVERSION: "8.0.x"
  JAVAVERSION: "11"

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    name: prerequisites
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@3a647064cf4697c7c6352b9a1d9e554450cbe957 # v1.6.1
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          cache: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build codegen binaries
        run: make codegen

      - name: Build Schema
        run: make generate_schema

      - name: Build Provider
        run: make provider

      - name: Check worktree clean
        uses: pulumi/git-status-check-action@54000b91124a8dd9fd6a872cb41f5dd246a46e7c # v1.1.1
        with:
          allowed-changes: |
            sdk/**/pulumi-plugin.json
            sdk/dotnet/*.*.csproj
            sdk/dotnet/version.txt
            sdk/go/**/pulumiUtilities.go
            sdk/nodejs/package.json
            sdk/python/pyproject.toml
            sdk/python/setup.py
            sdk/java/build.gradle

      - name: Tar provider binaries
        run: tar -zcf ${{ github.workspace }}/bin/provider.tar.gz -C ${{ github.workspace }}/bin/ pulumi-resource-${{ env.PROVIDER }} pulumi-gen-${{ env.PROVIDER }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulumi-${{ env.PROVIDER }}-provider.tar.gz
          path: ${{ github.workspace }}/bin/provider.tar.gz

      - name: Test Provider Library
        run: make test_provider
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Provider Integration (tests/)
        run: make test_integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_sdks:
    needs: prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        language:
          - nodejs
          - python
          - dotnet
          - go
          - java
    name: build_sdks
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@3a647064cf4697c7c6352b9a1d9e554450cbe957 # v1.6.1
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Provider Binary
        uses: ./.github/actions/download-provider

      - name: Generate SDK
        run: make generate_${{ matrix.language }}

      - name: Build SDK
        run: make build_${{ matrix.language }}

      - name: Check worktree clean
        uses: pulumi/git-status-check-action@54000b91124a8dd9fd6a872cb41f5dd246a46e7c # v1.1.1
        with:
          allowed-changes: |
            sdk/**/pulumi-plugin.json
            sdk/dotnet/*.*.csproj
            sdk/dotnet/version.txt
            sdk/go/**/pulumiUtilities.go
            sdk/nodejs/package.json
            sdk/python/pyproject.toml
            sdk/python/setup.py
            sdk/java/build.gradle

      - name: Tar SDK folder
        run: tar -zcf sdk/${{ matrix.language }}.tar.gz -C sdk/${{ matrix.language }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.language }}-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/${{ matrix.language }}.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build_sdks]
    name: publish
    permissions:
      contents: write
      id-token: write        # Required for SLSA provenance attestation
      attestations: write    # Required for actions/attest-build-provenance
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@3a647064cf4697c7c6352b9a1d9e554450cbe957 # v1.6.1
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5742e2a039330cbb23ebf35f046f814d4c6ff811 # v5.1.0
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -p 3 release --clean --timeout 60m0s
          version: '~> v2'

      # Attest every archive listed in checksums.txt (not the checksums file itself) so that
      # `gh attestation verify <archive> --owner JDetmar` (see .goreleaser.yml release notes) works.
      - name: Generate SLSA Provenance for Go Binaries
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: 'dist/checksums.txt'

  publish_sdks:
    runs-on: ubuntu-latest
    needs: publish
    name: publish_sdks
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing and npm provenance
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@3a647064cf4697c7c6352b9a1d9e554450cbe957 # v1.6.1
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download python SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/

      - name: Uncompress python SDK
        run: tar -zxf ${{ github.workspace }}/sdk/python.tar.gz -C ${{ github.workspace }}/sdk/python

      - name: Download dotnet SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dotnet-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/

      - name: Uncompress dotnet SDK
        run: tar -zxf ${{ github.workspace }}/sdk/dotnet.tar.gz -C ${{ github.workspace }}/sdk/dotnet

      - name: Download nodejs SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nodejs-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/

      - name: Uncompress nodejs SDK
        run: tar -zxf ${{ github.workspace }}/sdk/nodejs.tar.gz -C ${{ github.workspace }}/sdk/nodejs

      # Publish Node.js SDK to npm using Trusted Publishing (OIDC)
      # Requirements:
      # - Trusted Publisher configured on npmjs.com with exact match (case-sensitive):
      #   Owner: JDetmar, Repository: pulumi-webflow, Workflow: release.yml
      # - id-token: write permission (set above)
      # - npm 11.5+ for OIDC support
      # See: https://docs.npmjs.com/trusted-publishers/
      - name: Setup Node for npm publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      # The package is published from sdk/nodejs/bin, where `make build_nodejs` has emitted the
      # compiled JavaScript and .d.ts files and copied package.json/README/LICENSE/.npmignore.
      # Publishing from sdk/nodejs itself would ship only the TypeScript sources.
      - name: Publish Node.js SDK
        run: |
          cd sdk/nodejs/bin
          test -f index.js || { echo "sdk/nodejs/bin/index.js missing: the Node.js SDK was not built" >&2; exit 1; }
          # Determine npm tag based on version (prerelease versions need explicit tag)
          if [[ "$PROVIDER_VERSION" == *"-alpha"* ]]; then
            NPM_TAG="alpha"
          elif [[ "$PROVIDER_VERSION" == *"-beta"* ]]; then
            NPM_TAG="beta"
          elif [[ "$PROVIDER_VERSION" == *"-rc"* ]]; then
            NPM_TAG="rc"
          else
            NPM_TAG="latest"
          fi
          npm publish --access public --tag "$NPM_TAG" --provenance

      # Publish Python SDK to PyPI using Trusted Publishing (OIDC)
      # No API token needed - uses GitHub's OIDC identity
      # Automatically generates Sigstore attestations
      # See: https://docs.pypi.org/trusted-publishers/
      - name: Publish Python SDK
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/bin/dist/
          skip-existing: true  # Don't fail if version exists

      # Publish .NET SDK to NuGet using Trusted Publishing (OIDC)
      # No long-lived API key needed - uses GitHub's OIDC identity
      # See: https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      - name: NuGet Login (OIDC)
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Publish .NET SDK
        run: |
          cd sdk/dotnet
          dotnet nuget push $(find . -maxdepth 5 -name '*.nupkg' -print) --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish_java_sdk:
    runs-on: ubuntu-latest
    needs: publish
    name: publish_java_sdk
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@3a647064cf4697c7c6352b9a1d9e554450cbe957 # v1.6.1
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Installs Gradle (pinned in .config/mise.toml, the same version used to build the SDK).
      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download java SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: java-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/

      - name: Uncompress java SDK
        run: tar -zxf ${{ github.workspace }}/sdk/java.tar.gz -C ${{ github.workspace }}/sdk/java

      # Publish to Maven Central using gradle-nexus-publish-plugin v2.0.0
      # Tasks must be in same invocation: publishToSonatype followed by closeAndReleaseSonatypeStagingRepository
      # See: https://github.com/gradle-nexus/publish-plugin
      - name: Publish Java SDK
        run: gradle -p sdk/java publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          PACKAGE_VERSION: ${{ env.PROVIDER_VERSION }}
          SIGNING_KEY_ID: ${{ secrets.JAVA_SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.JAVA_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.JAVA_SIGNING_PASSWORD }}
          # Maven Central Portal credentials (token-based auth)
          PUBLISH_REPO_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PUBLISH_REPO_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish_go_sdk:
    runs-on: ubuntu-latest
    needs: publish_sdks
    name: publish_go_sdk
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - id: version
        name: Set Provider Version
        uses: pulumi/provider-version-action@3a647064cf4697c7c6352b9a1d9e554450cbe957 # v1.6.1
        with:
          set-env: PROVIDER_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download go SDK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-sdk.tar.gz
          path: ${{ github.workspace }}/sdk/

      - name: Uncompress go SDK
        run: tar -zxf ${{ github.workspace }}/sdk/go.tar.gz -C ${{ github.workspace }}/sdk/go

      - name: Publish Go SDK
        uses: pulumi/publish-go-sdk-action@0a153fa3c54227a3c0f7c97a57033ecfe94ab3c2 # v1.2.0
        with:
          repository: ${{ github.repository }}
          base-ref: ${{ github.sha }}
          source: sdk/go/webflow
          path: sdk/go/webflow
          version: ${{ steps.version.outputs.version }}
          additive: false
          files: "**"
