name: pull-request
on:
  pull_request_target:
    # Only comment once, when the PR is opened, rather than on every push.
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment-on-pr:
    runs-on: ubuntu-latest
    name: comment-on-pr
    # Only for PRs from forks; PRs from branches in this repo run the acceptance tests directly.
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
    # No checkout: this job only posts a comment and must not run code from the fork
    # under pull_request_target.
    - name: Comment PR
      uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
      with:
        message: >
          PR is now waiting for a maintainer to run the acceptance tests.

          **Note for the maintainer:** To run the acceptance tests, please comment */run-acceptance-tests* on the PR
        github-token: ${{ secrets.GITHUB_TOKEN }}
