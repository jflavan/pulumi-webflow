name: webflow-site-example-java
runtime: java
description: Example of creating and managing Site resources with Pulumi and Webflow

config:
  workspaceId:
    description: Webflow workspace ID (Enterprise workspace required for site creation)
  displayName:
    description: Display name for the site (shortName and timeZone are generated by Webflow)
  parentFolderId:
    description: Optional workspace folder to place the site in
  templateName:
    description: Optional site template (immutable - changing it replaces the site)
  publish:
    description: Set to true to publish the configured site to its webflow.io subdomain after each update
    default: false
