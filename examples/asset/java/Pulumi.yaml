name: webflow-asset-example-java
runtime: java
description: Example of creating and managing Asset resources with Pulumi and Webflow

config:
  siteId:
    description: The Webflow site ID
    secret: true
  environment:
    description: Deployment environment (development, staging, production)
    default: development
  heroImageUrl:
    description: Optional - an http(s) URL uploaded as the hero-image asset (omit to skip it)
